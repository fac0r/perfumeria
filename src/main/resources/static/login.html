<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumería - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
        }

        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .login-box p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 15px;
        }
        .campo label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .campo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        .campo input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-login:hover { background: #34495e; }

        .mensaje-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>🧴 Perfumería</h1>
    <p>Ingresá tus credenciales para continuar</p>

    <div class="campo">
        <label>Usuario</label>
        <input type="text" id="nombre" placeholder="Tu nombre de usuario" onkeyup="enterLogin(event)"/>
    </div>
    <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" onkeyup="enterLogin(event)"/>
    </div>

    <button class="btn-login" onclick="login()">Ingresar</button>
    <div class="mensaje-error" id="mensajeError">Usuario o contraseña incorrectos</div>
</div>

<script>
    // Si ya hay sesión activa, redirigir
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (usuario) window.location.href = 'index.html';

    function enterLogin(event) {
        if (event.key === 'Enter') login();
    }

    async function login() {
        const nombre = document.getElementById('nombre').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!nombre || !password) return;

        const res = await fetch('http://localhost:8080/api/usuarios/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, password })
        });

        if (res.ok) {
            const usuario = await res.json();
            localStorage.setItem('usuario', JSON.stringify(usuario));
            window.location.href = 'index.html';
        } else {
            document.getElementById('mensajeError').style.display = 'block';
        }
    }
</script>

</body>
</html>
